<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - 535250103</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Expense Tracker-535250104</h1>
        <p class="subtitle">Catat pengeluaran kamu dengan mudah</p>

        <div class="summary">
            <div class="summary-box">
                <h3>Jumlah Pengeluaran</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="summary-box">
                <h3>Total Pengeluaran</h3>
                <p id="totalAmount">Rp 0</p>
            </div>
        </div>

        <div class="form-box">
            <h2>Tambah Pengeluaran</h2>

            <form id="expenseForm">

                <div class="input-group">
                    <label for="expenseName">Nama / Keterangan</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Contoh: Makan siang"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="expenseAmount">Nominal</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Contoh: 25000"
                        min="1"
                        required
                    >
                </div>

                <button type="submit">Tambah Pengeluaran</button>

            </form>
        </div>

        <div class="expense-box">
            <h2>Daftar Pengeluaran</h2>

            <div id="expenseList">
                <p class="empty">Belum ada pengeluaran.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
